<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miradar Team Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1F2E22;
    --bg-soft: #263A2A;
    --card: #FBF6EC;
    --card-edge: #EFE6D2;
    --ink: #2B2118;
    --ink-soft: #6B5C48;
    --mustard: #E3A83B;
    --brick: #B4432F;
    --line: #3E5443;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 15% 0%, var(--bg-soft), transparent 55%), var(--bg);
    color:var(--card);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding: 32px 20px 80px;
  }
  .wrap{max-width:1120px;margin:0 auto;}
  .header-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:28px; flex-wrap:wrap; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--mustard); margin:0 0 10px; }
  h1{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(26px,4.5vw,40px); line-height:1.05; margin:0 0 10px; color:var(--card); }
  header p{ max-width:560px; font-size:14.5px; line-height:1.6; color:#C9D2C6; margin:0; }
  .lang-toggle{ display:flex; gap:4px; background:var(--bg-soft); border:1px solid var(--line); border-radius:20px; padding:3px; flex-shrink:0; }
  .lang-toggle button{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.06em; border:none; background:none; color:#9CAA9E; padding:6px 14px; border-radius:16px; cursor:pointer; }
  .lang-toggle button.active{ background:var(--mustard); color:#2B2118; font-weight:600; }
  .lang-toggle button:focus-visible{ outline:2px solid var(--mustard); outline-offset:2px; }
  .search-row{ margin-bottom:20px; }
  .search-row input{
    width:100%; max-width:360px; background:var(--bg-soft); border:1px solid var(--line);
    color:var(--card); border-radius:20px; padding:9px 16px; font-family:'Work Sans',sans-serif; font-size:13px;
  }
  .search-row input::placeholder{ color:#7C8A7E; }
  .search-row input:focus-visible{ outline:2px solid var(--mustard); }
  .crumbs{ display:flex; align-items:center; gap:10px; margin-bottom:20px; font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.05em; }
  .crumbs button{ background:none; border:none; color:var(--mustard); font-family:inherit; font-size:inherit; cursor:pointer; padding:6px 2px; }
  .crumbs button:hover{ text-decoration:underline; }
  .crumbs span{color:#7C8A7E;}
  .crumbs strong{color:var(--card); font-weight:500;}
  #categoryView .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .cat-card{
    position:relative; background:var(--card); color:var(--ink); border-radius:6px; padding:20px 16px 18px;
    cursor:pointer; border:1px solid var(--card-edge); text-align:left; font-family:inherit;
    box-shadow: 0 1px 0 rgba(0,0,0,.25), 0 10px 0 -6px var(--bg-soft); transition:transform .15s ease;
  }
  .cat-card:hover{ transform:translateY(-3px); }
  .cat-card:focus-visible{ outline:3px solid var(--mustard); outline-offset:3px; }
  .cat-card .icon{ width:30px; height:30px; color:var(--brick); margin-bottom:12px; }
  .cat-card h3{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; margin:0 0 4px; line-height:1.2; }
  .cat-card .count{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
  #itemView{ display:none; }
  #itemView .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; perspective:1200px; }
  .flip-outer{ height:290px; }
  .flip-outer.hidden{ display:none; }
  .flip-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.2,.2,1); cursor:pointer; border-radius:8px; }
  .flip-outer.flipped .flip-inner{ transform:rotateY(180deg); }
  .flip-outer:focus-visible .flip-inner{ outline:3px solid var(--mustard); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ .flip-inner{ transition:none; } }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:8px; padding:14px; display:flex; flex-direction:column; }
  .face-front{ background:var(--card); color:var(--ink); align-items:center; justify-content:center; text-align:center; border:1px solid var(--card-edge); box-shadow: 0 1px 0 rgba(0,0,0,.25), 0 8px 0 -5px var(--bg-soft); }
  .face-front .icon{ width:36px; height:36px; color:var(--brick); margin-bottom:10px; }
  .face-front .photo{ width:118px; height:118px; border-radius:8px; object-fit:cover; margin-bottom:10px; border:1px solid var(--card-edge); }
  .face-front h4{ font-family:'Fraunces', serif; font-weight:600; font-size:14.5px; margin:0; line-height:1.25; }
  .face-front .meta{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--ink-soft); margin-top:6px; letter-spacing:.03em; }
  .face-front .tap{ position:absolute; bottom:9px; right:11px; font-family:'IBM Plex Mono', monospace; font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:#B9AE93; }
  .face-back{ background:var(--card); color:var(--ink); transform:rotateY(180deg); border:1px solid var(--card-edge); overflow-y:auto; }
  .face-back::-webkit-scrollbar{ width:5px; }
  .face-back::-webkit-scrollbar-thumb{ background:var(--card-edge); border-radius:3px; }
  .face-back::after{ content:""; position:absolute; left:0; right:0; top:30px; border-top:1px dashed var(--card-edge); }
  .stamp{ align-self:flex-start; font-family:'IBM Plex Mono', monospace; font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--brick); border:1px solid var(--brick); border-radius:3px; padding:2px 6px; margin:24px 0 7px 16px; transform:rotate(-2deg); flex-shrink:0; }
  .face-back h4{ font-family:'Fraunces', serif; font-weight:600; font-size:13.5px; margin:0 0 6px 16px; padding-right:16px; flex-shrink:0; }
  .face-back .price{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--brick); margin:0 0 6px 16px; }
  .face-back .about{ font-size:11.5px; line-height:1.45; color:var(--ink-soft); margin:0 0 8px 16px; padding-right:16px; }
  .face-back .section-label{ font-family:'IBM Plex Mono', monospace; font-size:8px; letter-spacing:.08em; text-transform:uppercase; color:var(--brick); margin:0 0 3px 16px; }
  .face-back .allergens-confirmed{ font-size:11.5px; font-weight:600; line-height:1.4; color:var(--brick); margin:0 16px 8px; }
  .face-back .benefits{ margin:0 16px 8px; padding-left:16px; font-size:11.5px; line-height:1.4; color:var(--ink-soft); }
  .face-back .benefits li{ margin-bottom:3px; }
  .face-back .allergens-unconfirmed{ font-size:10.5px; line-height:1.4; color:#A99B7C; font-style:italic; margin:0 16px 8px; }
  .face-back .ingredients{ font-size:10.5px; line-height:1.4; color:var(--ink); margin:0 16px 8px; }
  .face-back .ingredients.unavailable{ color:#A99B7C; font-style:italic; }
  .face-back .note-label{ font-family:'IBM Plex Mono', monospace; font-size:8px; letter-spacing:.08em; text-transform:uppercase; color:#A99B7C; margin:0 0 3px 16px; }
  .face-back .note{ font-size:10.5px; line-height:1.35; color:#A99B7C; font-style:italic; margin:0 16px 14px; }
  footer{ max-width:1120px; margin:48px auto 0; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:#7C8A7E; line-height:1.6; }
  .empty-msg{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:#7C8A7E; padding:20px 0; }

  /* ---- tabs ---- */
  .tabs{ display:flex; gap:6px; margin:0 0 22px; border-bottom:1px solid var(--line); }
  .tabs button{ font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; background:none; border:none; border-bottom:3px solid transparent; color:#9CAA9E; padding:10px 16px 9px; cursor:pointer; margin-bottom:-1px; }
  .tabs button:hover{ color:var(--card); }
  .tabs button[aria-selected="true"]{ color:var(--mustard); border-bottom-color:var(--mustard); }
  .tabs button:focus-visible{ outline:2px solid var(--mustard); outline-offset:2px; }
  /* ---- scenarios ---- */
  .sc-intro{ max-width:640px; font-size:14.5px; line-height:1.6; color:#C9D2C6; margin:0 0 18px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip{ font-family:'Work Sans',sans-serif; font-size:12.5px; background:var(--bg-soft); color:#C9D2C6; border:1px solid var(--line); border-radius:18px; padding:6px 14px; cursor:pointer; }
  .chip:hover{ border-color:var(--mustard); }
  .chip[aria-pressed="true"]{ background:var(--mustard); color:#2B2118; border-color:var(--mustard); font-weight:600; }
  .chip:focus-visible{ outline:2px solid var(--mustard); outline-offset:2px; }
  .sc-bar{ display:flex; justify-content:flex-end; margin-bottom:12px; }
  .link-btn{ background:none; border:none; color:var(--mustard); font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.05em; cursor:pointer; padding:4px 2px; }
  .link-btn:hover{ text-decoration:underline; }
  .sc-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr)); gap:16px; align-items:start; }
  .sc-card{ background:var(--card); color:var(--ink); border:1px solid var(--card-edge); border-radius:8px; padding:18px 18px 16px; box-shadow:0 1px 0 rgba(0,0,0,.25), 0 8px 0 -5px var(--bg-soft); }
  .sc-tag{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--brick); border:1px solid var(--brick); border-radius:3px; padding:2px 6px; margin-bottom:8px; }
  .sc-card h3{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; line-height:1.2; margin:0 0 12px; }
  .sc-say-label,.sc-label{ font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.09em; text-transform:uppercase; color:var(--brick); margin:0 0 4px; }
  .sc-label{ margin-top:14px; }
  .sc-label-avoid{ color:#8A5A2B; }
  .sc-say{ margin:0 0 14px; padding:2px 0 2px 12px; border-left:3px solid var(--mustard); font-family:'Fraunces',serif; font-style:italic; font-size:16px; line-height:1.4; color:var(--ink); }
  .sc-reveal{ font-family:'Work Sans',sans-serif; font-size:13px; font-weight:600; background:var(--ink); color:var(--card); border:none; border-radius:18px; padding:8px 16px; cursor:pointer; }
  .sc-reveal:hover{ background:#3C2F22; }
  .sc-reveal:focus-visible{ outline:3px solid var(--mustard); outline-offset:2px; }
  .sc-card.open .sc-reveal{ background:none; color:var(--ink-soft); border:1px solid var(--card-edge); font-weight:500; }
  .sc-resp{ margin-top:6px; }
  .sc-resp[hidden]{ display:none; }
  .sc-script{ background:#F4EAD0; border-left:3px solid var(--brick); border-radius:3px; padding:10px 12px; font-size:13.5px; line-height:1.5; }
  .sc-do,.sc-avoid{ margin:0; padding-left:20px; font-size:13px; line-height:1.5; color:var(--ink); }
  .sc-do li,.sc-avoid li{ margin-bottom:4px; }
  .sc-avoid{ list-style:none; padding-left:0; }
  .sc-avoid li{ position:relative; padding-left:20px; color:var(--ink-soft); }
  .sc-avoid li::before{ content:"\2717"; position:absolute; left:2px; color:var(--brick); font-weight:700; }
  .sc-tip{ font-size:12.5px; line-height:1.5; color:var(--ink-soft); margin:12px 0 0; padding-top:10px; border-top:1px dashed var(--card-edge); }
  .sc-rel{ display:flex; flex-wrap:wrap; gap:6px; }
  .sc-rel button{ font-family:'Work Sans',sans-serif; font-size:12px; background:none; color:var(--brick); border:1px solid var(--brick); border-radius:14px; padding:4px 11px; cursor:pointer; }
  .sc-rel button:hover{ background:var(--brick); color:var(--card); }
  .sc-rel button:focus-visible{ outline:2px solid var(--mustard); outline-offset:2px; }
  .sc-note{ max-width:760px; font-size:12px; line-height:1.6; color:#9CAA9E; margin:26px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <header>
      <p class="eyebrow" id="txtEyebrow"></p>
      <h1 id="txtTitle"></h1>
      <p id="txtSubtitle"></p>
    </header>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="btnEn" type="button">EN</button>
      <button id="btnRu" type="button">RU</button>
    </div>
  </div>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tabProducts" aria-selected="true"></button>
    <button type="button" role="tab" id="tabScenarios" aria-selected="false"></button>
  </nav>

  <div id="productsPane">
  <div class="search-row">
    <input type="text" id="searchBox" placeholder="">
  </div>

  <div class="crumbs">
    <button id="crumbAll"></button>
    <span id="crumbSep" style="display:none;">/</span>
    <strong id="crumbCurrent"></strong>
  </div>

  <div id="categoryView"><div class="grid" id="categoryGrid"></div></div>
  <div id="itemView"><div class="grid" id="itemGrid"></div></div>

  </div>

  <div id="scenarioPane" hidden>
    <p class="sc-intro" id="scIntro"></p>
    <div class="chips" id="scChips" role="group"></div>
    <div class="sc-bar"><button type="button" class="link-btn" id="scToggleAll"></button></div>
    <div class="sc-grid" id="scGrid"></div>
    <p class="sc-note" id="scNote"></p>
  </div>

  <footer id="txtFooter"></footer>
</div>

<script>
const ICONS = {

const UI = {
  en:{
    tabProducts:"Products",
    tabScenarios:"Scenarios",
    scIntro:"Real situations from the shop floor. Read what the guest says, think of your own answer first, then reveal the suggested response. Practise out loud with a colleague.",

    scDo:"What to do",

    scTip:"Why it works:",

    scAll:"All",
    scRevealAll:"Reveal all",
    scHideAll:"Hide all",
    scNote:"These are suggested wording and good habits, not rules. Discounts, refunds and compensation follow your manager's decisions — when unsure, call the manager. Allergen answers come only from the card or the kitchen, never from guesswork; the allergen lines on the cards are a reference, not an official declaration.",

    title:"Know what you're selling.",
    subtitle:"The full Miradar Wolt menu, organised for quick lookups on shift. Pick a category, tap a card to flip it.",

    tapToFlip:"tap to flip",
    benefits:"Benefits",

    ingredientsUnavailable:"Not listed on Wolt \u2014 confirm with kitchen.",
    allergensLabel:"Allergens (EU 14, per Wolt)",
    allergensUnavailable:"Not confirmed \u2014 check with kitchen.",
    allergensNotFood:"Not a food item.",
    staffNotes:"Staff notes",
    staffNotesPlaceholder:"Confirm allergens and add a selling point here.",
    items:"items",
    searchPlaceholder:"Search all products\u2026",

    footer:"Rebuilt from Miradar's live Wolt listing (wolt.com \u2014 Miradar Kolonakiou) on 19 Oct 2026, covering every item on the listing at that time, using the 'Product info' section Wolt shows for each item. Ingredients are copied from Wolt's own text and allergens come from Wolt's allergen statement for each item, shown as the standard EU-14 names. Where the ingredient list suggests an allergen that Wolt's statement does not mention, the card says so with a \u26a0 \u2014 treat those as 'possible' until the kitchen confirms. Where Wolt gives no allergen statement but does list ingredients, allergens are read off the ingredient list and labelled as such; where Wolt gives neither, the item is marked 'not confirmed'. Small-portion salads without their own Wolt entry show the full-size dish's data, with a note. This is NOT an official Miradar allergen declaration: it does not cover cross-contamination or shared equipment, Wolt's text is not cross-checked against kitchen recipes, and it must be verified with the kitchen before anything is told to a customer with an allergy. Wolt's menu changes over time, so this snapshot will drift \u2014 re-pull periodically. Wolt prices run about 10% above in-store, so prices here are shown at the in-store rate (Wolt price \u00f7 1.10). Photos are placeholders. BENEFITS: the points on each card are general nutritional facts about the main ingredients on Wolt's list (for example protein, omega-3 in oily fish, calcium in dairy), plus factual selling points taken from that list; they are not claims about the finished dish and not medical advice. Evidence for some popular 'functional' claims (kefir probiotics, matcha, Tartary buckwheat) is mostly preliminary, so the cards describe what the product is rather than what it will do for health \u2014 please do the same with guests. Background reading: Cleveland Clinic on cottage cheese; Frontiers in Microbiology (2016) review of kefir; a review of matcha in the Journal of Education, Healt     footer:"\u0421\u043e\u0431\u0440\u0430\u043d\u043e \u0441 \u0430\u043a\u0442\u0443\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u043b\u0438\u0441\u0442\u0438\u043d\u0433\u0430 Miradar \u043d\u0430 Wolt (wolt.com \u2014 Miradar Kolonakiou) \u043d\u0430 19 \u043e\u043a\u0442\u044f\u0431\u0440\u044f 2026 \u0433., \u043f\u043e \u0432\u0441\u0435\u043c \u043f\u043e\u0437\u0438\u0446\u0438\u044f\u043c \u043b\u0438\u0441\u0442\u0438\u043d\u0433\u0430 \u043d\u0430 \u0442\u043e\u0442 \u043c\u043e\u043c\u0435\u043d\u0442, \u0438\u0437 \u0440\u0430\u0437\u0434\u0435\u043b\u0430 \u00ab\u0418\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044f \u043e \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u0435\u00bb, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 Wolt \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0439 \u043f\u043e\u0437\u0438\u0446\u0438\u0438. \u0421\u043e\u0441\u0442\u0430\u0432 \u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d \u0438\u0437 \u0442\u0435\u043a\u0441\u0442\u0430 Wolt, \u0430\u043b\u043b\u0435\u0440\u0433\u0435\u043d\u044b \u2014 \u0438\u0437 \u0437\u0430\u044f\u0432\u043b\u0435\u043d\u0438\u044f Wolt \u043f\u043e \u043a\u0430\u0436\u0434\u043e\u0439 \u043f\u043e\u0437\u0438\u0446\u0438\u0438, \u0432 \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0445 \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u044f\u0445 \u0415\u0421-14. \u0415\u0441\u043b\u0438 \u043f\u043e \u0441\u043e\u0441\u0442\u0430\u0432\u0443 \u0432\u0438\u0434\u043d\u043e \u0430\u043b\u043b\u0435\u0440\u0433\u0435\u043d, \u043a\u043e\u0442\u043e\u0440\u043e\u0433\u043e \u043d\u0435\u0442 \u0432 \u0437\u0430\u044f\u0432\u043b\u0435\u043d\u0438\u0438 Wolt, \u043d\u0430 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0435 \u0441\u0442\u043e\u0438\u0442 \u0437\u043d\u0430\u0447\u043e\u043a \u26a0 \u2014 \u0441\u0447\u0438\u0442\u0430\u0439\u0442\u0435 \u0435\u0433\u043e \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u044b\u043c, \u043f\u043e\u043a\u0430 \u043a\u0443\u0445\u043d\u044f \u043d\u0435 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0434\u0438\u0442. \u0415\u0441\u043b\u0438 \u0437\u0430\u044f\u0432\u043b\u0435\u043d\u0438\u044f \u043e\u0431 \u0430\u043b\u043b\u0435\u0440\u0433\u0435\u043d\u0430\u0445 \u043d\u0430 Wolt \u043d\u0435\u0442, \u043d\u043e \u0441\u043e\u0441\u0442\u0430\u0432 \u0443\u043a\u0430\u0437\u0430\u043d, \u0430\u043b\u043b\u0435\u0440\u0433\u0435\u043d\u044b \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0435\u043d\u044b \u043f\u043e \u0441\u043e\u0441\u0442\u0430\u0432\u0443 \u0438 \u043f\u043e\u043c\u0435\u0447\u0435\u043d\u044b \u0442\u0430\u043a; \u0435\u0441\u043b\u0438 \u043d\u0435\u0442 \u043d\u0438 \u0442\u043e\u0433\u043e, \u043d\u0438 \u0434\u0440\u0443\u0433\u043e\u0433\u043e \u2014 \u043f\u043e\u0437\u0438\u0446\u0438\u044f \u043f\u043e\u043c\u0435\u0447\u0435\u043d\u0430 \u00ab\u043d\u0435 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u043e\u00bb. \u0414\u043b\u044f \u043c\u0430\u043b\u044b\u0445 \u043f\u043e\u0440\u0446\u0438\u0439 \u0441\u0430\u043b\u0430\u0442\u043e\u0432 \u0431\u0435\u0437 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0439 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u043d\u0430 Wolt \u043f\u043e\u043a\u0430\u0437\u0430\u043d\u044b \u0434\u0430\u043d\u043d\u044b\u0435 \u043f\u043e\u043b\u043d\u043e\u0440\u0430\u0437\u043c\u0435\u0440\u043d\u043e\u0433\u043e \u0431\u043b\u044e\u0434\u0430, \u0441 \u043f\u043e\u043c\u0435\u0442\u043a\u043e\u0439. \u042d\u0442\u043e \u041d\u0415 \u043e\u0444\u0438\u0446\u0438\u0430\u043b\u044c\u043d\u0430\u044f \u0434\u0435\u043a\u043b\u0430\u0440\u0430\u0446\u0438\u044f \u0430\u043b\u043b\u0435\u0440\u0433\u0435\u043d\u043e\u0432 Miradar: \u043f\u0435\u0440\u0435\u043a\u0440\u0451\u0441\u0442\u043d\u043e\u0435 \u0437\u0430\u0433\u0440\u044f\u0437\u043d\u0435\u043d\u0438\u0435 \u0438 \u043e\u0431\u0449\u0435\u0435 \u043e\u0431\u043e\u0440\u0443\u0434\u043e\u0432\ const SCENARIOS = [{"id": "s1", "t": "first", "links": [], "en": {"title": "“Just looking”", "say": "I'm just looking, thanks.", "do": ["Smile, say “of course” and step back — don't follow the guest.", "Stay within sight and notice where they slow down or look longer.", "After a minute, come back with one easy, specific offer — not “Can I help?”."], "script": "Of course, take your time. If you'd like a suggestion — something sweet or something for lunch — just say.", "avoid": ["“Can I help you?” — it invites an automatic “no”.", "Hovering next to the guest or listing products."], "tip": "The aim is contact without pressure. Most guests meet your eyes again within a minute — that's your cue."}, "ru": {"title": "«Просто смотрю»", "say": "Я просто посмотрю, спасибо.", "do": ["Улыбнитесь, скажите «конечно» и отойдите — не ходите за гостем.", "Оставайтесь в поле зрения и замечайте, где гость задержался взглядом.", "Через минуту вернитесь с одним лёгким, конкретным предложением — не «Вам подсказать?»."], "script": "Конечно, смотрите, не спешите. Если захотите совет — что-то сладкое или на обед — просто скажите.", "avoid": ["«Вам что-то подсказать?» — на это автоматически отвечают «нет».", "Стоять над душой или перечислять товары."], "tip": "Цель — контакт без давления. Большинство гостей снова встречают ваш взгляд в течение минуты — это сигнал."}}, {"id": "s2", "t": "first", "links": ["Lunch Sets", "Pastry", "Desserts"], "en": {"title": "First-time visitor", "say": "I've never been here — what do you have?", "do": ["Welcome warmly, then give a quick map of three or four groups — not the whole menu.", "Ask one question about what they need today.", "Recommend one item right away, so the guest has something to start with."], "script": "Welcome! We have hot lunch sets, pastries and desserts, dairy and cottage cheese, bread — and delicacies such as caviar and smoked fish. Are you after a quick bite, or something to take home?", "avoid": ["Reading out the entire menu.", "“We have everything” — it tells the guest nothing."], "tip": "Three groups plus one question is easy to remember and easy to answer."}, "ru": {"title": "Первый визит", "say": "Я у вас впервые — что у вас есть?", "do": ["Тепло поприветствуйте и дайте «карту» из трёх-четырёх групп — не всё меню.", "Задайте один вопрос: что нужно сегодня.", "Сразу порекомендуйте одну позицию, чтобы гостю было с чего начать."], "script": "Добро пожаловать! У нас горячие обеденные сеты, выпечка и десерты, молочная продукция и творог, хлеб, а ещё деликатесы — икра, копчёная рыба. Вам перекусить сейчас или взять что-то с собой?", "avoid": ["Зачитывать всё меню подряд.", "«У нас всё есть» — это ничего не говорит гостю."], "tip": "Три группы и один вопрос легко запомнить, и на них легко ответить."}}, {"id": "s3", "t": "first", "links": [], "en": {"title": "A language you don't speak", "say": "(The guest speaks a language you don't know well.)", "do": ["Greet in the guest's language if you can; otherwise smile and slow down.", "Switch the flashcards to EN or RU and show the card — names, prices and ingredients are there.", "Short sentences, simple words, point to the product. Call a colleague who speaks the language."], "script": "Hello! Let me show you — I can find everything on this screen.", "avoid": ["Speaking louder or faster.", "Guessing an answer about ingredients you can't explain."], "tip": "Guests are patient when they feel welcome. Showing the card is better than a half-understood explanation."}, "ru": {"title": "Незнакомый язык", "say": "(Гость говорит на языке, который вы знаете плохо.)", "do": ["Поприветствуйте на языке гостя, если можете; иначе улыбнитесь и говорите медленнее.", "Переключите флэшкарты на EN или RU и покажите карточку — названия, цены и состав там есть.", "Короткие фразы, простые слова, показывайте на товар. Позовите коллегу, который знает язык."], "script": "Hello! Let me show you — I can find everything on this screen.", "avoid": ["Говорить громче или быстрее.", "Угадывать ответ о составе, который вы не можете объяснить."], "tip": "Гости терпеливы, когда им рады. Показать карточку лучше, чем полупонятное объяснение."}}, {"id": "s4", "t": "choose", "links": [], "en": {"title": "“What do you recommend?”", "say": "I don't know what to choose — what do you recommend?", "do": ["Ask two quick questions: for whom / for what occasion, and sweet or savoury (or any restrictions).", "Recommend ONE item using Taste → Composition → Reason.", "Offer a second option only if the guest asks."], "script": "Is it for you or for someone else — and do you prefer something sweet or savoury? Then I'd suggest this one: [taste], it's made with [main ingredients from the card], and it goes well with a coffee.", "avoid": ["Listing five items — the guest chooses nothing.", "“Everything is good.”"], "tip": "Take the taste and the ingredients straight from the card, so you never invent anything."}, "ru": {"title": "«Что посоветуете?»", "say": "Не знаю, что выбрать, — что посоветуете?", "do": ["Задайте два быстрых вопроса: для кого / по какому случаю и сладкое или солёное (или есть ограничения).", "Порекомендуйте ОДНУ позицию по формуле Вкус → Состав → Повод.", "Второй вариант предлагайте, только если гость попросит."], "script": "Это для вас или для кого-то ещё — и вам больше по вкусу сладкое или солёное? Тогда посоветую вот это: [вкус], в составе [основные ингредиенты из карточки], и оно хорошо идёт с кофе.", "avoid": ["Называть пять позиций — гость так ничего и не выберет.", "«Всё вкусное»."], "tip": "Вкус и состав берите прямо из карточки — так вы ничего не выдумаете."}}, {"id": "s5", "t": "choose", "links": [], "en": {"title": "“What sells best?”", "say": "What's your bestseller?", "do": ["Don't quote “bestseller” or numbers you can't back up.", "If your manager tells you what guests come back for, you may say that about those items only.", "Turn it into one taste question and recommend one item."], "script": "I'd rather suggest what suits you than just what sells most. Do you like it lighter or richer? Then I'll pick one for you.", "avoid": ["Inventing sales figures or “our most popular”.", "Pushing the most expensive item by default."], "tip": "Honest answers build trust — guests notice when a recommendation is made for them."}, "ru": {"title": "«Что у вас самое популярное?»", "say": "А что у вас лучше всего берут?", "do": ["Не называйте «хит продаж» и цифры, которые не можете подтвердить.", "Если руководитель сообщил, за чем гости возвращаются, можно сказать это — только про эти позиции.", "Переведите разговор в один вопрос о вкусе и порекомендуйте одну позицию."], "script": "Я бы лучше предложил то, что подойдёт именно вам, а не просто то, что берут чаще. Вам что ближе — полегче или посытнее? Тогда выберу для вас.", "avoid": ["Выдумывать цифры продаж и «самое популярное».", "Всегда предлагать самое дорогое."], "tip": "Честный ответ вызывает доверие — гости чувствуют, когда рекомендация сделана для них."}}, {"id": "s6", "t": "choose", "links": ["Lunch Sets", "Pastry", "Salads"], "en": {"title": "Quick lunch", "say": "I've only got ten minutes — I need something for lunch.", "do": ["Ask two things: hot or cold, and eat here or take away.", "Offer one or two grab-and-go options: a lunch set, a salad, or a pastry such as samsa or cheburek.", "Confirm the choice and pack it at once — speed is part of the service."], "script": "Of course — hot or cold? A lunch set, or something from the pastries like a samsa? I'll pack it straight away.", "avoid": ["A long explanation of ingredients unless the guest asks.", "Offering items that need time to prepare when the guest has said they are in a hurry."], "tip": "A rushed guest wants a decision made easy: two options, one recommendation."}, "ru": {"title": "Быстрый обед", "say": "У меня всего десять минут — нужно что-то на обед.", "do": ["Уточните два момента: горячее или холодное, здесь или с собой.", "Предложите один-два варианта «на ходу»: обеденный сет, салат или выпечка — например, самса или чебурек.", "Подтвердите выбор и сразу упакуйте — скорость тоже часть сервиса."], "script": "Конечно! Горячее или холодное? Обеденный сет или что-то из выпечки, например самса? Сразу упакую.", "avoid": ["Долго рассказывать о составе, если гость не спрашивает.", "Предлагать то, что долго готовить, когда гость сказал, что спешит."], "tip": "Спешащему гостю нужно облегчить решение: два варианта, одна рекомендация."}}, {"id": "s7", "t": "choose", "links": ["Salads", "Soups"], "en": {"title": "“Something light / healthy”", "say": "I'd like something light, something healthy.", "do": ["Ask what “light” means to this guest: fewer calories, no meat, less sugar, a smaller portion?", "Open the card and show the ingredients and the Benefits notes — they come from the ingredient list.", "Offer a Small salad or a soup, and let the guest decide."], "script": "Light for you means smaller portion, no meat, or less sugar? Let me show you a couple of options and what's in them.", "avoid": ["Health or diet claims such as “good for weight loss” or “detox”.", "Quoting calories — they are not on the cards."], "tip": "“Healthy” means different things to different people. Facts from the ingredient list let the guest decide."}, "ru": {"title": "«Что-нибудь лёгкое / полезное»", "say": "Хочу что-нибудь лёгкое, полезное.", "do": ["Уточните, что для гостя «лёгкое»: меньше калорий, без мяса, меньше сахара, небольшая порция?", "Откройте карточку и покажите состав и пункт «Преимущества» — они взяты из списка ингредиентов.", "Предложите салат Small или суп и дайте гостю выбрать."], "script": "Лёгкое для вас — это небольшая порция, без мяса или с меньшим количеством сахара? Покажу пару вариантов и что в них входит.", "avoid": ["Заявления о пользе для здоровья: «для похудения», «детокс».", "Называть калории — их нет в карточках."], "tip": "«Полезное» каждый понимает по-своему. Факты из состава позволяют гостю решить самому."}}, {"id": "s8", "t": "allergy", "links": ["Desserts", "Bento & Cakes"], "en": {"title": "Nut allergy", "say": "My son has a nut allergy — is there any nut in this?", "do": ["Take it seriously and stay calm. Open the card and read the Allergens line and the ingredients to the guest.", "If the card lists tree nuts or peanuts, or says “not confirmed”, say so plainly — and mention “may contain traces” where it is written.", "Offer to confirm with the kitchen. If any doubt remains, advise not to buy. Never say “it should be fine”."], "script": "Thank you for telling me. Let me check carefully: on our information this [contains nuts / is not confirmed]. I'd rather confirm with the kitchen than guess — one moment, please.", "avoid": ["“I think there are no nuts.”", "Letting the guest taste the product “to see”."], "tip": "Allergen lines on the cards are a reference taken from Wolt's product info, not an official declaration. The kitchen's confirmation is final."}, "ru": {"title": "Аллергия на орехи", "say": "У моего сына аллергия на орехи — здесь есть орехи?", "do": ["Отнеситесь серьёзно и сохраняйте спокойствие. Откройте карточку и прочитайте гостю строку «Аллергены» и состав.", "Если в карточке указаны орехи или арахис либо «не подтверждено» — скажите об этом прямо, а также про «возможны следы», если это написано.", "Предложите уточнить у кухни. Если сомнения остаются, посоветуйте не покупать. Никогда не говорите «наверное, всё в порядке»."], "script": "Спасибо, что предупредили. Давайте проверю внимательно: по нашим данным здесь [есть орехи / это не подтверждено]. Лучше я уточню у кухни, чем буду угадывать, — одну минуту.", "avoid": ["«Кажется, орехов нет».", "Давать попробовать «на пробу»."], "tip": "Строки об аллергенах в карточках — справочная информация из данных Wolt, а не официальная декларация. Окончательное подтверждение даёт кухня."}}, {"id": "s9", "t": "allergy", "links": ["Desserts"], "en": {"title": "Gluten-free desserts", "say": "Do you have anything gluten-free?", "do": ["Three desserts are named gluten-free: Brownies, Tiramisu and Bounty. Their ingredient lists have no gluten ingredients.", "But each card also says traces of gluten are possible because of production — and that is why Wolt's allergen line shows gluten.", "Say both parts. For coeliac disease or a serious intolerance, confirm with the kitchen before the sale."], "script": "These are made without gluten-containing ingredients — for example banana, cocoa and eggs in the brownie. But traces of gluten are possible because of how they're produced. If you have coeliac disease, I'd like to confirm with the kitchen first.", "avoid": ["“Yes, completely gluten-free” based only on the name.", "Hiding the trace warning."], "tip": "Preference and medical need are different. For a guest who just avoids gluten the answer is “yes, with a note”; for coeliac it is “let me confirm”."}, "ru": {"title": "Десерты без глютена", "say": "У вас есть что-нибудь без глютена?", "do": ["Три десерта названы gluten-free: Brownies, Tiramisu и Bounty. В их составе нет ингредиентов с глютеном.", "Но в каждой карточке указано, что из-за производства возможны следы глютена, — поэтому в строке аллергенов Wolt стоит глютен.", "Скажите обе части. При целиакии или серьёзной непереносимости сначала уточните у кухни."], "script": "Они сделаны без ингредиентов с глютеном — например, в брауни банан, какао и яйца. Но из-за особенностей производства следы глютена возможны. Если у вас целиакия, я бы сначала уточнил у кухни.", "avoid": ["«Да, полностью без глютена» только по названию.", "Умалчивать о предупреждении про следы."], "tip": "Предпочтение и медицинская необходимость — разные вещи. Тому, кто просто избегает глютен, ответ «да, с оговоркой»; при целиакии — «давайте уточню»."}}, {"id": "s10", "t": "allergy", "links": ["Dairy & Cottage Cheese", "Desserts"], "en": {"title": "Lactose-free / dairy-free", "say": "I can't have lactose — what can I get?", "do": ["Be honest: most of our dairy line and many pastries and desserts contain milk — check the Milk line on the card.", "Bounty is named Lactose-Free and its ingredient list has no milk, but Wolt still lists Milk as an allergen — confirm with the kitchen before selling it to someone with a milk allergy.", "For drinks with plant-based or lactose-free milk, check what is available today — don't promise."], "script": "Most of our dairy and desserts do contain milk, so let's check card by card. One dessert is made without milk ingredients, but I want to confirm it with the kitchen first.", "avoid": ["Calling something “dairy-free” from the name alone.", "Mixing up lactose intolerance and milk allergy — they are different."], "tip": "Ask: “intolerance or allergy?” An allergy needs the kitchen's confirmation every time."}, "ru": {"title": "Без лактозы / без молока", "say": "Мне нельзя лактозу — что можно взять?", "do": ["Скажите честно: большая часть молочной линейки и многие выпечка и десерты содержат молоко — смотрите строку «Молоко» в карточке.", "Bounty называется Lactose-Free, в составе молока нет, но в аллергенах Wolt всё равно указано молоко — уточните у кухни, прежде чем продавать гостю с аллергией на молоко.", "Про напитки на растительном или безлактозном молоке уточните, что есть сегодня, — ничего не обещайте."], "script": "Большая часть нашей молочной продукции и десертов содержит молоко, так что давайте смотреть карточки по одной. Один десерт сделан без молочных ингредиентов, но я хочу сначала уточнить у кухни.", "avoid": ["Называть что-то «безмолочным» только по названию.", "Путать непереносимость лактозы и аллергию на молоко — это разное."], "tip": "Спросите: «непереносимость или аллергия?» При аллергии каждый раз нужно подтверждение кухни."}}, {"id": "s11", "t": "allergy", "links": ["Salads", "Main Dishes", "Bread"], "en": {"title": "Vegetarian / fasting", "say": "Is this vegetarian? Is it okay for Lent?", "do": ["Ask what exactly they avoid — meat, fish, dairy, eggs, honey. It differs from person to person.", "Read the ingredient list on the card together with the guest.", "Don't call a dish vegan or lenten unless every ingredient clearly fits. If the list is missing, say “I'll confirm with the kitchen”."], "script": "Let's look at the ingredients together — what exactly do you avoid: meat, fish, dairy, eggs?", "avoid": ["Deciding from the name — a pancake or a pie may contain egg or milk.", "Promising “lenten” without reading the list."], "tip": "Fasting rules are personal. Your job is to give the facts from the card, not to decide for the guest."}, "ru": {"title": "Вегетарианское / постное", "say": "Это вегетарианское? Для поста подойдёт?", "do": ["Уточните, что именно гость не ест: мясо, рыбу, молочное, яйца, мёд. У всех по-разному.", "Прочитайте состав в карточке вместе с гостем.", "Не называйте блюдо веганским или постным, если не все ингредиенты явно подходят. Если состава нет — «уточню у кухни»."], "script": "Давайте вместе посмотрим состав — что именно вы не едите: мясо, рыбу, молочное, яйца?", "avoid": ["Решать по названию — в блинах или пирожках могут быть яйца и молоко.", "Обещать «постное», не прочитав состав."], "tip": "Правила поста у каждого свои. Ваша задача — дать факты из карточки, а не решать за гостя."}}, {"id": "s12", "t": "allergy", "links": ["Desserts"], "en": {"title": "“No added sugar”", "say": "I'm watching sugar — are these desserts sugar-free?", "do": ["Some desserts are named “No Added Sugar”. Per their ingredient lists they are sweetened with agave syrup or stevia, and with fruit such as banana or apple purée.", "Say that clearly: no added sugar does not mean not sweet or no sugar at all.", "For people managing blood sugar, suggest checking with their doctor."], "script": "These have no added sugar — the ingredient list shows agave syrup or stevia, plus fruit like banana. They're still sweet, so if you're managing blood sugar I'd check with your doctor.", "avoid": ["“Safe for diabetics” or “sugar-free”.", "Medical advice of any kind."], "tip": "Quote the ingredient list. Let the guest and their doctor decide."}, "ru": {"title": "«Без добавленного сахара»", "say": "Я слежу за сахаром — эти десерты без сахара?", "do": ["Часть десертов называется «No Added Sugar». По составу они подслащены сиропом агавы или стевией, а также фруктами — бананом, яблочным пюре.", "Скажите чётко: «без добавленного сахара» — не значит «не сладкое» или «совсем без сахара».", "Гостям, которые контролируют сахар в крови, посоветуйте уточнить у врача."], "script": "В этих десертах нет добавленного сахара — по составу это сироп агавы или стевия и фрукты, например банан. Они всё равно сладкие, так что, если вы контролируете сахар в крови, лучше уточнить у врача.", "avoid": ["«Безопасно при диабете» или «без сахара».", "Любые медицинские советы."], "tip": "Цитируйте состав. Решение остаётся за гостем и его врачом."}}, {"id": "s13", "t": "price", "links": ["Salads"], "en": {"title": "“That's expensive”", "say": "That's quite expensive!", "do": ["Don't defend the price and don't apologise for it.", "Acknowledge the feeling and ask what budget the guest has in mind.", "Offer a smaller size (many salads come in Small), a simpler item, or a different product that fits."], "script": "I understand. What budget did you have in mind? I can suggest a smaller portion, or something simpler that you'll still enjoy.", "avoid": ["“It's expensive because it's quality” as a first reaction.", "Dropping the price on your own."], "tip": "Behind “expensive” is usually “I'm not sure it's worth it for me”. A smaller or simpler option solves it."}, "ru": {"title": "«Дорого»", "say": "Что-то дороговато!", "do": ["Не оправдывайте цену и не извиняйтесь за неё.", "Признайте чувство гостя и спросите, на какой бюджет он рассчитывал.", "Предложите меньшую порцию (многие салаты есть в размере Small), позицию проще или другой подходящий продукт."], "script": "Понимаю вас. На какой бюджет вы рассчитывали? Могу предложить порцию поменьше или что-то попроще, что вам тоже понравится.", "avoid": ["«Дорого, потому что качественно» как первая реакция.", "Самостоятельно снижать цену."], "tip": "За «дорого» обычно стоит «не уверен, что оно того стоит для меня». Меньшая порция или позиция проще решают вопрос."}}, {"id": "s14", "t": "price", "links": [], "en": {"title": "Shop price vs Wolt", "say": "Why is the price here different from the app?", "do": ["Say it plainly: prices in the store are lower than in the Wolt app.", "Read the actual price off the till or the shelf label — that is the one that counts.", "Don't criticise Wolt or the delivery service."], "script": "Yes — in the store the prices are lower than in the delivery app, and here you can see the product and choose it yourself.", "avoid": ["Quoting an exact percentage unless you're sure of the item's price.", "Making promises about the app's prices."], "tip": "Store price = Wolt price ÷ 1.10, so roughly 9% lower. Always take the final figure from the till."}, "ru": {"title": "Цена в магазине и в Wolt", "say": "Почему здесь цена другая, чем в приложении?", "do": ["Скажите прямо: в магазине цены ниже, чем в приложении Wolt.", "Назовите реальную цену с кассы или ценника — важна именно она.", "Не критикуйте Wolt и службу доставки."], "script": "Да, в магазине цены ниже, чем в приложении доставки, и здесь можно увидеть товар и выбрать самому.", "avoid": ["Называть точный процент, если не уверены в цене позиции.", "Давать обещания про цены в приложении."], "tip": "Цена в магазине = цена в Wolt ÷ 1,10, то есть примерно на 9% ниже. Итоговую цифру всегда берите с кассы."}}, {"id": "s15", "t": "price", "links": [], "en": {"title": "“Can I get a discount?”", "say": "Can you give me a discount?", "do": ["Don't promise discounts. You can't change prices yourself unless your manager has authorised it.", "Offer a cheaper alternative or a smaller portion.", "If the guest insists — for example a large order — say you'll ask the manager, and call them."], "script": "I can't change the price myself, but let me ask my manager — one moment. Meanwhile, I can suggest an option that fits your budget.", "avoid": ["A private discount or “next time”.", "Saying “no” coldly with no alternative."], "tip": "A calm “let me check” keeps the guest and protects the rules for everyone."}, "ru": {"title": "«Скидку сделаете?»", "say": "А скидку можете сделать?", "do": ["Не обещайте скидок. Менять цены самостоятельно нельзя, если руководитель этого не разрешил.", "Предложите более доступную альтернативу или меньшую порцию.", "Если гость настаивает — например, при большом заказе — скажите, что уточните у руководителя, и позвоните ему."], "script": "Цену я сам изменить не могу, но давайте спрошу у руководителя — одну минуту. А пока могу предложить вариант под ваш бюджет.", "avoid": ["Частная скидка или «в следующий раз».", "Холодное «нет» без альтернативы."], "tip": "Спокойное «сейчас уточню» сохраняет гостя и защищает правила для всех."}}, {"id": "s16", "t": "gift", "links": ["Premium Chocolate", "Bento & Cakes", "Caviar"], "en": {"title": "A gift", "say": "I need a gift for a business partner — something special.", "do": ["Ask: who is it for, what is the occasion, what is the budget, any allergies or dietary rules?", "Match the level: dates or prunes in Belgian chocolate for a small elegant gift; a bento cake for a celebration; caviar, balyk or foie gras for a truly special one.", "Check allergies — Premium Chocolate lists tree nuts, and some items may also contain peanuts. Confirm with the kitchen if the recipient has an allergy.", "Ask your manager what gift packaging is available today — don't promise it."], "script": "Who is the gift for, and what's the occasion? I'll suggest something for your budget — and I'd like to be sure there are no allergies to avoid.", "avoid": ["Choosing the most expensive item by default.", "Promising gift boxes or ribbons you haven't confirmed."], "tip": "A gift sale is about the recipient. Two questions — occasion and budget — are enough to choose well."}, "ru": {"title": "Подарок", "say": "Мне нужен подарок деловому партнёру — что-то особенное.", "do": ["Спросите: для кого, по какому случаю, какой бюджет, есть ли аллергии или ограничения в питании?", "Подберите уровень: финики или чернослив в бельгийском шоколаде — небольшой элегантный подарок; бенто-торт — для праздника; икра, балык или фуа-гра — действительно особенный подарок.", "Проверьте аллергии — в премиальном шоколаде указаны орехи, а в некоторых позициях возможен арахис. Если у получателя аллергия, уточните у кухни.", "Узнайте у руководителя, какая подарочная упаковка есть сегодня, — не обещайте заранее."], "script": "Для кого подарок и по какому случаю? Подберу вариант под ваш бюджет — и хочу убедиться, что нет аллергий, которых надо избежать.", "avoid": ["По умолчанию выбирать самое дорогое.", "Обещать коробки и ленты, не проверив, что они есть."], "tip": "Подарок продаётся ради получателя. Двух вопросов — повод и бюджет — достаточно, чтобы выбрать хорошо."}}, {"id": "s17", "t": "gift", "links": ["Caviar"], "en": {"title": "Which caviar?", "say": "What's the difference between these caviars?", "do": ["Ask how it will be served — toast or blini, a festive table, or a gift — and whether the guest prefers a milder or a bolder taste.", "Use the “about” text on each card: Keta — large eggs, delicate shell, gentle sea flavour; Gorbusha — classic bright flavour; Nerka — small eggs, bold taste.", "Sturgeon caviars (White Sturgeon, Kaluga, Amur, Sterlet, Royal Persian) are the premium tier for special occasions.", "Prices aren't on these cards yet — check with your manager before quoting."], "script": "Keta has larger eggs and a gentle sea flavour; nerka has smaller eggs and a bolder taste. What will you serve it with?", "avoid": ["Inventing origin, catch date or quality grades.", "Comparing with other shops."], "tip": "Describe by size of the egg, taste and occasion — exactly as written on the cards."}, "ru": {"title": "Какая икра?", "say": "А чем отличается эта икра от той?", "do": ["Спросите, как будут подавать — на бутербродах или блинах, на праздничном столе или в подарок — и какой вкус ближе: мягкий или яркий.", "Опирайтесь на текст «о продукте» в карточке: кета — крупная икра, нежная оболочка, мягкий морской вкус; горбуша — классический яркий вкус; нерка — мелкая икра, насыщенный вкус.", "Осетровая икра (белый осётр, калуга, амурский осётр, стерлядь, Royal Persian) — премиальный уровень для особых случаев.", "Цен в этих карточках пока нет — до названия цены уточните у руководителя."], "script": "У кеты икринки крупнее и мягкий морской вкус, у нерки — мельче и вкус насыщеннее. С чем будете подавать?", "avoid": ["Выдумывать происхождение, дату вылова или сорта.", "Сравнивать с другими магазинами."], "tip": "Описывайте по размеру икринки, вкусу и поводу — точно так, как написано в карточках."}}, {"id": "s18", "t": "gift", "links": ["Caviar", "Balyks & Smoked Fish", "Foie Gras"], "en": {"title": "“Is it real? Is it fresh?”", "say": "Is it real? Is it fresh — where is it from?", "do": ["Show the label: dates and the producer details exactly as printed.", "Say only what the label or the supplier information states.", "If you don't know the origin, say so and ask your manager — and ask for a supplier information sheet for the premium range."], "script": "Let me show you the label with the dates and the producer details. For exactly where it comes from, I'll confirm with my manager so I give you the right answer.", "avoid": ["“Definitely fresh, the best” without a source.", "Naming an origin you haven't verified."], "tip": "This is the question that decides high-value sales. A confident, honest answer with the label in hand beats any sales talk."}, "ru": {"title": "«Настоящая? Свежая?»", "say": "Это настоящая? Свежая — откуда она?", "do": ["Покажите этикетку: даты и данные производителя — как напечатано.", "Говорите только то, что указано на этикетке или в информации от поставщика.", "Если не знаете происхождение, так и скажите и уточните у руководителя — а ещё попросите лист информации о поставщиках для премиальной линейки."], "script": "Давайте покажу этикетку: на ней даты и данные производителя. Откуда именно продукт, я уточню у руководителя, чтобы дать вам точный ответ.", "avoid": ["«Точно свежая, лучшая» без подтверждения.", "Называть происхождение, которое вы не проверяли."], "tip": "Именно этот вопрос решает продажи дорогих позиций. Уверенный честный ответ с этикеткой в руках лучше любой «продажной речи»."}}, {"id": "s19", "t": "complaint", "links": ["Pastry"], "en": {"title": "“It was stale”", "say": "The pastry I bought yesterday was stale — I'm not happy.", "do": ["Listen without interrupting. Apologise sincerely — don't argue or explain.", "Ask which product and when it was bought, and thank the guest for telling you.", "Offer a replacement or refund according to your manager's rules; if you're unsure, call the manager.", "Write it in the complaints log and check the rest of that batch."], "script": "I'm very sorry — that's not the quality we want for you. Let me replace it, or call my manager so we sort this out properly.", "avoid": ["“That's impossible, everything is fresh.”", "Offering compensation you aren't authorised to give."], "tip": "A guest who complains still cares. Solve it the same day and the guest often comes back."}, "ru": {"title": "«Было несвежее»", "say": "Выпечка, которую я вчера купил, была несвежей, я недоволен.", "do": ["Слушайте, не перебивая. Искренне извинитесь — не спорьте и не оправдывайтесь.", "Уточните, какой продукт и когда куплен, и поблагодарите гостя, что сообщил.", "Предложите замену или возврат по правилам руководителя; если не уверены, позвоните ему.", "Запишите в журнал жалоб и проверьте остальную партию."], "script": "Мне очень жаль — это не то качество, которое мы хотим вам дать. Давайте заменю или позвоню руководителю, чтобы разобраться как следует.", "avoid": ["«Не может быть, у нас всё свежее».", "Предлагать компенсацию, которую вы не вправе давать."], "tip": "Гостю, который жалуется, всё ещё не всё равно. Решите вопрос в тот же день — и гость часто возвращается."}}, {"id": "s20", "t": "complaint", "links": [], "en": {"title": "Guest feels unwell", "say": "I don't feel well after eating this… I think it's an allergic reaction.", "do": ["Stop selling the product. Ask calmly how the guest feels and have them sit down.", "Serious signs — trouble breathing, swelling of the face or throat, fainting — call 112 immediately, then the manager.", "Don't give medical advice or medication. Stay with the guest.", "Keep the packaging and write down what was eaten, when, and the label details."], "script": "Please sit down, I'm here with you. I'm calling for help right now.", "avoid": ["Arguing about the cause.", "Leaving the guest alone."], "tip": "Safety first, explanations later. Every second counts with a severe allergic reaction."}, "ru": {"title": "Гостю стало плохо", "say": "Мне нехорошо после этого… кажется, это аллергия.", "do": ["Остановите продажу этого продукта. Спокойно спросите о самочувствии и предложите гостю присесть.", "Тяжёлые признаки — затруднённое дыхание, отёк лица или горла, обморок — сразу звоните 112, затем руководителю.", "Не давайте медицинских советов и лекарств. Оставайтесь рядом с гостем.", "Сохраните упаковку и запишите, что и когда съели, а также данные с этикетки."], "script": "Пожалуйста, присядьте, я с вами. Сейчас же вызываю помощь.", "avoid": ["Спорить о причине.", "Оставлять гостя одного."], "tip": "Сначала безопасность, потом объяснения. При тяжёлой аллергической реакции дорога каждая секунда."}}, {"id": "s21", "t": "complaint", "links": [], "en": {"title": "Wolt order issue", "say": "My Wolt order arrived without one of the items.", "do": ["Apologise first. Don't suggest the mistake is the guest's or the courier's.", "Get the order number and the missing item, and check against the order if you can.", "Pass it to the manager the same day and follow their procedure for app orders. Don't promise a refund yourself."], "script": "I'm sorry about that. Could you give me the order number and the item that's missing? I'll pass it to my manager right away so it's resolved.", "avoid": ["Blaming the courier or the app.", "Promising a refund or a replacement on your own."], "tip": "Write down the order number and the item — that makes the manager's job a one-minute task."}, "ru": {"title": "Проблема с заказом Wolt", "say": "В моём заказе из Wolt не оказалось одной позиции.", "do": ["Сначала извинитесь. Не намекайте, что ошибся гость или курьер.", "Узнайте номер заказа и недостающую позицию, сверьте с заказом, если можете.", "В тот же день передайте руководителю и действуйте по его порядку для заказов из приложения. Сами возврат не обещайте."], "script": "Приношу извинения. Подскажите номер заказа и какой позиции не хватило? Сразу передам руководителю, чтобы вопрос решили.", "avoid": ["Обвинять курьера или приложение.", "Самостоятельно обещать возврат или замену."], "tip": "Запишите номер заказа и позицию — тогда руководителю на это хватит минуты."}}, {"id": "s22", "t": "complaint", "links": [], "en": {"title": "Long wait", "say": "I've been waiting for ages!", "do": ["Acknowledge: “Thank you for waiting.” Tell the truth about how long it will take.", "Serve strictly in order; give a quick word to the next guest — “I'll be with you in a minute”.", "If the queue is long, call a colleague from the back and prepare payment in advance."], "script": "Thank you for waiting, and I'm sorry about that. I'll be with you right away.", "avoid": ["Arguing about how long it really was.", "Ignoring waiting guests while serving one."], "tip": "Guests forgive waiting when they are noticed."}, "ru": {"title": "Долгое ожидание", "say": "Я тут уже целую вечность жду!", "do": ["Признайте: «Спасибо, что подождали». Честно скажите, сколько ещё потребуется.", "Обслуживайте строго по очереди; следующему гостю скажите пару слов — «Я освобожусь через минуту».", "Если очередь большая, позовите коллегу из подсобки и подготовьте оплату заранее."], "script": "Спасибо, что подождали, и простите за это. Сейчас же вас обслужу.", "avoid": ["Спорить, сколько на самом деле ждали.", "Игнорировать ожидающих гостей, пока обслуживаете одного."], "tip": "Гости прощают ожидание, когда их замечают."}}, {"id": "s23", "t": "upsell", "links": ["Desserts", "Cookies & Confections"], "en": {"title": "Coffee only", "say": "Just a cappuccino, please.", "do": ["Offer one pairing, not a list.", "Name the item and give one reason: “a small éclair goes well with a cappuccino”.", "Accept a “no” politely and finish the order."], "script": "Would you like something small with your coffee — a cookie or an éclair, for example?", "avoid": ["Offering three items at once.", "Repeating the offer after “no”."], "tip": "One clear suggestion is easier to say yes to than a list."}, "ru": {"title": "Только кофе", "say": "Мне только капучино, пожалуйста.", "do": ["Предложите одну пару, а не список.", "Назовите позицию и одну причину: «маленький эклер хорошо идёт с капучино».", "На «нет» отвечайте вежливо и завершайте заказ."], "script": "Хотите что-нибудь небольшое к кофе — например, печенье или эклер?", "avoid": ["Предлагать сразу три позиции.", "Повторять предложение после «нет»."], "tip": "На одно ясное предложение проще сказать «да», чем на список."}}, {"id": "s24", "t": "upsell", "links": ["Bento & Cakes", "Hot Drinks"], "en": {"title": "A whole cake", "say": "I'd like to order a whole cake.", "do": ["Ask the occasion, the number of guests and the pickup time.", "Ask about allergies among the guests. All cakes in Bento & Cakes list gluten, eggs and milk, and several also list soy or tree nuts.", "Check the size or weight on the label before promising a number of servings.", "Offer one add-on: coffee or tea to go with it."], "script": "Lovely — what's the occasion, and how many guests? Does anyone have an allergy? Let me check the card for you.", "avoid": ["Promising servings without checking the size.", "Skipping the allergy question for a group."], "tip": "For a party, one forgotten allergy is the biggest risk — ask before the sale, not after."}, "ru": {"title": "Целый торт", "say": "Хочу заказать целый торт.", "do": ["Спросите повод, число гостей и время получения.", "Спросите про аллергии у гостей. Все торты в «Бенто-торты и торты» содержат глютен, яйца и молоко, а несколько — ещё сою или орехи.", "Проверьте размер или вес на этикетке, прежде чем обещать число порций.", "Предложите одну добавку: кофе или чай к торту."], "script": "Прекрасно! По какому поводу и сколько будет гостей? Нет ли у кого-то аллергии? Сейчас проверю по карточке.", "avoid": ["Обещать число порций, не проверив размер.", "Не спросить про аллергии, если гостей много."], "tip": "Для праздника главный риск — забытая аллергия: спрашивайте до продажи, а не после."}}, {"id": "s25", "t": "upsell", "links": ["Lunch Sets", "Cold Drinks"], "en": {"title": "Lunch set add-on", "say": "I'll take the chicken lunch set.", "do": ["Confirm the choice first, then offer one add-on: a drink or a dessert.", "Make it specific: “a kompot or a coffee with that?”", "Move to payment promptly — don't keep the guest waiting."], "script": "Great choice. Would you like a drink with it — a kompot, or a coffee?", "avoid": ["Adding without asking.", "Offering both a drink and a dessert and a bread together."], "tip": "Offering after the main choice feels like service, not selling."}, "ru": {"title": "Допродажа к обеду", "say": "Возьму обеденный сет с курицей.", "do": ["Сначала подтвердите выбор, затем предложите одну добавку: напиток или десерт.", "Конкретно: «компот или кофе к этому?»", "Быстро переходите к оплате — не задерживайте гостя."], "script": "Отличный выбор. Хотите напиток к нему — компот или кофе?", "avoid": ["Добавлять без спроса.", "Сразу предлагать и напиток, и десерт, и хлеб."], "tip": "Предложение после основного выбора воспринимается как сервис, а не как продажа."}}, {"id": "s26", "t": "upsell", "links": ["Dairy & Cottage Cheese", "Breakfast"], "en": {"title": "Parent with a child", "say": "I'm looking for something for my little one.", "do": ["Ask whether the child has any allergies or restrictions — and whether they'd like something sweet or savoury.", "Show the kids' range: Kids Yoghurt, Kids Kefir, Kids Ryazhenka, Kids Breakfast, Kids Dumplings.", "Read the allergens on each card (the dairy items list Milk). No health claims."], "script": "How old is your little one, and is there anything they can't have? I'll show you what we have for kids and what's in each.", "avoid": ["Nutritional or health claims for children.", "Handing over food without checking allergens."], "tip": "Parents ask about safety first, taste second — start with the allergy question."}, "ru": {"title": "Родитель с ребёнком", "say": "Ищу что-нибудь для малыша.", "do": ["Спросите, есть ли у ребёнка аллергии или ограничения, и что ближе — сладкое или нет.", "Покажите детскую линейку: Kids Yoghurt, Kids Kefir, Kids Ryazhenka, Kids Breakfast, Kids Dumplings.", "Прочитайте аллергены в каждой карточке (в молочных позициях указано молоко). Без заявлений о пользе."], "script": "Сколько лет малышу и есть ли что-то, что ему нельзя? Покажу, что у нас есть для детей и что входит в каждую позицию.", "avoid": ["Заявления о пользе питания для детей.", "Давать еду, не проверив аллергены."], "tip": "Родители сначала спрашивают о безопасности, потом о вкусе — начните с вопроса об аллергиях."}}, {"id": "s27", "t": "know", "links": ["SONI Matcha", "Hot Drinks", "Cold Drinks"], "en": {"title": "What is matcha?", "say": "What exactly is matcha? Does it have caffeine?", "do": ["Matcha is a green tea powder, so it contains caffeine. Don't compare its effect with coffee or promise health effects.", "Offer the menu drinks (Matcha Cappuccino, Ice Matcha and others) or Soni Matcha for home.", "If the guest is sensitive to caffeine, suggest checking with their doctor."], "script": "Matcha is made from ground green tea leaves, so yes, it contains caffeine. Would you like to try it hot or iced?", "avoid": ["Health or energy claims.", "Saying it has “less caffeine” or “more” than coffee."], "tip": "Keep it simple: what it is, how it's served, and an honest note about caffeine."}, "ru": {"title": "Что такое матча?", "say": "А что такое матча? В ней есть кофеин?", "do": ["Матча — порошок зелёного чая, поэтому в нём есть кофеин. Не сравнивайте действие с кофе и не обещайте пользу для здоровья.", "Предложите напитки из меню (Matcha Cappuccino, Ice Matcha и другие) или Soni Matcha домой.", "Если гость чувствителен к кофеину, предложите уточнить у врача."], "script": "Матча делается из растёртых листьев зелёного чая, так что кофеин в ней есть. Хотите попробовать горячую или со льдом?", "avoid": ["Заявления о пользе или бодрости.", "Говорить «кофеина меньше» или «больше», чем в кофе."], "tip": "Просто: что это, как подаётся и честная заметка про кофеин."}}, {"id": "s28", "t": "know", "links": ["Frozen Items"], "en": {"title": "Cooking and shelf life", "say": "How long does it keep? How do I cook it?", "do": ["For frozen items, use the cooking instructions printed on the packaging — don't guess times.", "Storage and shelf life: read them from the label. Never estimate.", "If a label is missing or unreadable, don't sell the item — call the manager."], "script": "Let me read the label for you — the cooking time and storage are printed there, so we get it exactly right.", "avoid": ["Guessing “about ten minutes”.", "Telling the guest to “just refreeze it”."], "tip": "A wrong cooking time or storage tip can spoil the product — or harm the guest."}, "ru": {"title": "Приготовление и срок хранения", "say": "Сколько это хранится? Как готовить?", "do": ["Для замороженных продуктов используйте инструкцию на упаковке — не называйте время «на глаз».", "Хранение и срок годности читайте на этикетке. Не прикидывайте.", "Если этикетки нет или она нечитаема — не продавайте, позовите руководителя."], "script": "Давайте прочитаю этикетку: время приготовления и условия хранения указаны на ней, так мы всё сделаем точно.", "avoid": ["Гадать «минут десять».", "Советовать «просто заморозьте снова»."], "tip": "Неверное время приготовления или совет по хранению могут испортить продукт или навредить гостю."}}];
let lang = 'en';
let openCatIdx = null;
let searchTerm = '';

const categoryView = document.getElementById('categoryView');
const itemView = document.getElementById('itemView');
const categoryGrid = document.getElementById('categoryGrid');
const itemGrid = document.getElementById('itemGrid');
const crumbAll = document.getElementById('crumbAll');
const crumbSep = document.getElementById('crumbSep');
const crumbCurrent = document.getElementById('crumbCurrent');
const btnEn = document.getElementById('btnEn');
const btnRu = document.getElementById('btnRu');
const searchBox = document.getElementById('searchBox');

function applyStaticText(){
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById('txtEyebrow').textContent = t.eyebrow;
  document.getElementById('txtTitle').textContent = t.title;
  document.getElementById('txtSubtitle').textContent = t.subtitle;
  document.getElementById('txtFooter').textContent = t.footer;
  crumbAll.textContent = t.allCategories;
  tabProducts.textContent = t.tabProducts;
  tabScenarios.textContent = t.tabScenarios;
  document.getElementById('scIntro').textContent = t.scIntro;
  document.getElementById('scNote').textContent = t.scNote;
  searchBox.placeholder = t.searchPlaceholder;
  btnEn.classList.toggle('active', lang==='en');
  btnRu.classList.toggle('active', lang==='ru');
  if(openCatIdx !== null){
    crumbCurrent.textContent = DATA[openCatIdx][lang].name;
  }
}

function renderCategories(){
  const t = UI[lang];
  categoryGrid.innerHTML = DATA.map((cat, i) => `
    <button class="cat-card" data-idx="${i}">
      <span class="icon">${ICONS[cat.icon]}</span>
      <h3>${cat[lang].name}</h3>
      <div class="count">${cat.items.length} ${t.items}</div>
    </button>
  `).join('');
  [...categoryGrid.querySelectorAll('.cat-card')].forEach(btn=>{
    btn.addEventListener('click', ()=> openCategory(Number(btn.dataset.idx)));
  });
}

function cardHTML(cat, item, idx){
  const t = UI[lang];
  const hasIngredients = !!item.ingredients;
  const ingredientsHTML = hasIngredients
    ? `<p class="ingredients">${item.ingredients[lang]}</p>`
    : `<p class="ingredients unavailable">${t.ingredientsUnavailable}</p>`;
  const aboutHTML = item[lang].about ? `<p class="about">${item[lang].about}</p>` : ``;
  let allergensHTML = '';
  if(item.allergens && item.allergens.notFood){
    allergensHTML = `<p class="section-label">${t.allergensLabel}</p><p class="allergens-unconfirmed">${t.allergensNotFood}</p>`;
  } else if(item.allergens && item.allergens.confirmed){
    allergensHTML = `<p class="section-label">${t.allergensLabel}</p><p class="allergens-confirmed">${item.allergens[lang]}</p>`;
  } else {
    allergensHTML = `<p class="section-label">${t.allergensLabel}</p><p class="allergens-unconfirmed">${t.allergensUnavailable}</p>`;
  }
  const benefitsHTML = (item.benefits && item.benefits[lang] && item.benefits[lang].length)
    ? `<p class="section-label">${t.benefits}</p><ul class="benefits">${item.benefits[lang].map(b=>`<li>${b}</li>`).join('')}</ul>`
    : '';
  return `
    <div class="flip-outer" tabindex="0" data-idx="${idx}">
      <div class="flip-inner">
        <div class="face face-front">
          ${item.img ? `<img class="photo" src="${item.img}" alt="">` : `<span class="icon">${ICONS[cat.icon]}</span>`}
          <h4>${item[lang].name}</h4>
          ${item[lang].price ? `<div class="meta">${item[lang].price}${item[lang].pack ? ' \u00B7 '+item[lang].pack : ''}</div>` : ``}
          <span class="tap">${t.tapToFlip}</span>
        </div>
        <div class="face face-back">
          <div class="stamp">${cat[lang].name}</div>
          <h4>${item[lang].name}</h4>
          ${item[lang].price ? `<div class="price">${item[lang].price}</div>` : ``}
          ${aboutHTML}
          ${allergensHTML}
          ${benefitsHTML}
          <p class="section-label">${t.ingredients}</p>
          ${ingredientsHTML}
          <p class="note-label">${t.staffNotes}</p>
          <p class="note">${t.staffNotesPlaceholder}</p>
        </div>
      </div>
    </div>
  `;
}

function attachFlipHandlers(){
  [...itemGrid.querySelectorAll('.flip-outer')].forEach(card=>{
    const flip = ()=> card.classList.toggle('flipped');
    card.addEventListener('click', flip);
    card.addEventListener('keydown', e=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); flip(); }
    });
  });
}

function renderItems(){
  const cat = DATA[openCatIdx];
  itemGrid.innerHTML = cat.items.map((item, i) => cardHTML(cat, item, i)).join('');
  attachFlipHandlers();
}

function renderSearch(){
  const t = UI[lang];
  const q = searchTerm.trim().toLowerCase();
  let results = [];
  DATA.forEach(cat=>{
    cat.items.forEach(item=>{
      const hay = (item.en.name + ' ' + item.ru.name + ' ' + (item.en.about||'') + ' ' + (item.ru.about||'')).toLowerCase();
      if(hay.includes(q)) results.push({cat, item});
    });
  });
  if(results.length === 0){
    itemGrid.innerHTML = `<div class="empty-msg">${t.noResults}</div>`;
    return;
  }
  itemGrid.innerHTML = results.map((r,i) => cardHTML(r.cat, r.item, i)).join('');
  attachFlipHandlers();
}

function openCategory(idx){
  openCatIdx = idx;
  searchTerm = '';
  searchBox.value = '';
  renderItems();
  categoryView.style.display = 'none';
  itemView.style.display = 'block';
  crumbSep.style.display = 'inline';
  crumbCurrent.textContent = DATA[idx][lang].name;
  window.scrollTo({top:0, behavior:'smooth'});
}

function showAll(){
  openCatIdx = null;
  searchTerm = '';
  searchBox.value = '';
  categoryView.style.display = 'block';
  itemView.style.display = 'none';
  crumbSep.style.display = 'none';
  crumbCurrent.textContent = '';
}

function setLang(newLang){
  lang = newLang;
  applyStaticText();
  renderScChips(); renderScenarios();
  if(searchTerm){ renderSearch(); }
  else{
    renderCategories();
    if(openCatIdx !== null) renderItems();
  }
}

crumbAll.addEventListener('click', showAll);
btnEn.addEventListener('click', ()=> setLang('en'));
btnRu.addEventListener('click', ()=> setLang('ru'));
searchBox.addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  if(searchTerm.trim() === ''){
    if(openCatIdx !== null){ renderItems(); }
    else{ categoryView.style.display='block'; itemView.style.display='none'; crumbSep.style.display='none'; crumbCurrent.textContent=''; }
    return;
  }
  categoryView.style.display = 'none';
  itemView.style.display = 'block';
  crumbSep.style.display = 'none';
  crumbCurrent.textContent = '';
  openCatIdx = null;
  renderSearch();
});


let view = 'products';
let scTheme = 'all';
const scRevealed = new Set();
const scGrid = document.getElementById('scGrid');
const scChips = document.getElementById('scChips');
const scToggleAll = document.getElementById('scToggleAll');
const tabProducts = document.getElementById('tabProducts');
const tabScenarios = document.getElementById('tabScenarios');
const productsPane = document.getElementById('productsPane');
const scenarioPane = document.getElementById('scenarioPane');

function scVisible(){ return SCENARIOS.filter(x => scTheme==='all' || x.t===scTheme); }
function themeLabel(k){ return SC_THEMES.find(x=>x.key===k)[lang]; }

function renderScChips(){
  const t = UI[lang];
  const mk = (key,label,n) => `<button type="button" class="chip" data-theme="${key}" aria-pressed="${scTheme===key}">${label} · ${n}</button>`;
  scChips.innerHTML = mk('all', t.scAll, SCENARIOS.length) +
    SC_THEMES.map(th => mk(th.key, th[lang], SCENARIOS.filter(x=>x.t===th.key).length)).join('');
  [...scChips.querySelectorAll('.chip')].forEach(b=> b.addEventListener('click', ()=>{
    scTheme = b.dataset.theme; renderScChips(); renderScenarios();
  }));
}

function scToggleLabel(){
  const t = UI[lang];
  const vis = scVisible();
  const allOpen = vis.length > 0 && vis.every(x => scRevealed.has(x.id));
  scToggleAll.textContent = allOpen ? t.scHideAll : t.scRevealAll;
  return allOpen;
}

function renderScenarios(){
  const t = UI[lang];
  scGrid.innerHTML = scVisible().map(x=>{
    const c = x[lang]; const open = scRevealed.has(x.id);
    const rel = x.links.map(name=>{
      const idx = DATA.findIndex(cat => cat.en.name === name);
      return idx < 0 ? '' : `<button type="button" data-cat="${idx}">${DATA[idx][lang].name}</button>`;
    }).join('');
    return `<article class="sc-card${open?' open':''}" data-id="${x.id}">
      <span class="sc-tag">${themeLabel(x.t)}</span>
      <h3>${c.title}</h3>
      <p class="sc-say-label">${t.scSay}</p>
      <blockquote class="sc-say">${c.say}</blockquote>
      <button type="button" class="sc-reveal" aria-expanded="${open}" aria-controls="resp-${x.id}">${open ? t.scHide : t.scShow}</button>
      <div class="sc-resp" id="resp-${x.id}" ${open?'':'hidden'}>
        <p class="sc-label">${t.scScript}</p>
        <div class="sc-script">${c.script}</div>
        <p class="sc-label">${t.scDo}</p>
        <ol class="sc-do">${c.do.map(d=>`<li>${d}</li>`).join('')}</ol>
        <p class="sc-label sc-label-avoid">${t.scAvoid}</p>
        <ul class="sc-avoid">${c.avoid.map(d=>`<li>${d}</li>`).join('')}</ul>
        ${c.tip ? `<p class="sc-tip"><strong>${t.scTip}</strong> ${c.tip}</p>` : ''}
        ${rel ? `<p class="sc-label">${t.scRelated}</p><div class="sc-rel">${rel}</div>` : ''}
      </div>
    </article>`;
  }).join('');
  [...scGrid.querySelectorAll('.sc-card')].forEach(card=>{
    const id = card.dataset.id;
    card.querySelector('.sc-reveal').addEventListener('click', ()=>{
      if(scRevealed.has(id)) scRevealed.delete(id); else scRevealed.add(id);
      renderScenarios();
      const again = scGrid.querySelector(`.sc-card[data-id="${id}"] .sc-reveal`);
      if(again) again.focus();
    });
    [...card.querySelectorAll('.sc-rel button')].forEach(b=> b.addEventListener('click', ()=>{
      setView('products'); openCategory(Number(b.dataset.cat));
    }));
  });
  scToggleLabel();
}

scToggleAll.addEventListener('click', ()=>{
  const allOpen = scToggleLabel();
  scVisible().forEach(x => allOpen ? scRevealed.delete(x.id) : scRevealed.add(x.id));
  renderScenarios();
});

function setView(v){
  view = v;
  const sc = v === 'scenarios';
  productsPane.hidden = sc;
  scenarioPane.hidden = !sc;
  tabProducts.setAttribute('aria-selected', String(!sc));
  tabScenarios.setAttribute('aria-selected', String(sc));
  try{ history.replaceState(null, '', sc ? '#scenarios' : location.pathname + location.search); }catch(e){}
  window.scrollTo({top:0});
}
tabProducts.addEventListener('click', ()=> setView('products'));
tabScenarios.addEventListener('click', ()=> setView('scenarios'));

applyStaticText();
renderCategories();
renderScChips();
renderScenarios();
if(location.hash === '#scenarios') setView('scenarios');
</script>
</body>
</html>
